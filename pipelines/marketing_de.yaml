# Pipeline template definition for marketing and communications roles.
#
# Im Marketing entscheidet die Arbeitsprobe. Deshalb gibt es einen eigenen
# Schritt dafuer: ohne ihn landen Portfolios in Mailanhaengen und im Gespraech
# sitzt jemand, der sie nicht gelesen hat.

name: "Marketing & Kommunikation DE"
description: "Pipeline für Marketing und Kommunikation: Vorauswahl, Arbeitsproben, Gespräch, Entscheidung."

is_default: false
pipeline_without_ai: false

match:
  category: "Marketing und Kommunikation"

steps:
  - name: "Neu"
    category: New
    color: "#C9D5E3"

  - name: "Vorauswahl"
    category: PreScreening
    color: "#9BD9B0"
    agent:
      name: "Marketing-Vorauswahl"
      type: proactive
      description: "Klärt verantwortete Kanäle, Arbeitsproben und den Anteil eigener Umsetzung."
      human_in_loop: conditional
      condition: "Bewerber fragt nach Budgetverantwortung, Teamgröße oder Agenturzusammenarbeit"
      active: true
      instructions: |
        Du führst die Vorauswahl für eine Marketing- oder Kommunikationsrolle durch.

        Kläre in dieser Reihenfolge:
        1. Welche Kanäle hat die Person zuletzt eigenverantwortet?
        2. Bitte um zwei Arbeitsproben mit einem Satz dazu, was daran ihr Anteil war.
        3. Selbst umgesetzt oder über Agentur und Dienstleister gesteuert?

        Frage bei Kampagnen nach dem Ergebnis, nicht nur nach der Idee.
        Bewerte die Arbeitsproben nicht - sammle sie ein.
        Stelle höchstens drei Rückfragen und formuliere sie einzeln.

  - name: "Arbeitsproben"
    category: DataCollection
    color: "#A2D2FF"

  - name: "Persönliches Interview"
    category: HumanInterview
    color: "#FFB703"

  - name: "Teamentscheidung"
    category: TeamDiscussion
    color: "#FFD59E"

  - name: "Vertragsangebot"
    category: ContractOffer
    color: "#B7E4C7"

  - name: "Abgelehnt"
    category: Rejected
    color: "#E5989B"
