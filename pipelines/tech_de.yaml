# Pipeline template definition.
#
# This is the "agreed configuration" for a customer: which steps their hiring
# process has, and which AI agent sits on each step. The tool creates it in
# Paul's Job if it is absent, and afterwards verifies every onboarded job
# against it.
#
# `category` accepts either the category ID (PreScreening) or its localised name
# (Vorauswahl) - both are resolved against /recruiting/job-step-categories.

name: "Tech Recruiting DE"
description: "Standard-Pipeline für technische Rollen: Vorauswahl, KI-Interview, persönliches Gespräch."

# Makes this the company default, so jobs created later can use AutoInit
# instead of naming a template id.
is_default: true

# Set to true for a pipeline that never involves AI and therefore consumes no
# credits. It then permits only New, TeamDiscussion, CodeExecution and Rejected.
pipeline_without_ai: false

steps:
  # 'New' is the fixed entry step - the API does not allow deleting or renaming it.
  - name: "Neu"
    category: New
    color: "#C9D5E3"

  - name: "Vorauswahl"
    category: PreScreening
    color: "#9BD9B0"
    agent:
      name: "Vorauswahl-Agent"
      type: proactive
      description: "Stellt Rückfragen zu Pflichtkriterien und sortiert offensichtlich unpassende Profile aus."
      human_in_loop: conditional
      condition: "Bewerber stellt Fragen zu Gehalt, Vertrag oder Standort"
      active: true
      instructions: |
        Du führst die Vorauswahl für eine technische Position durch.

        Prüfe in dieser Reihenfolge:
        1. Erfüllt die Person die Pflichtkriterien der Ausschreibung?
        2. Ist ein Arbeitsort in Deutschland oder Remote-EU möglich?
        3. Ist der früheste Eintrittstermin innerhalb der nächsten sechs Monate?

        Stelle höchstens drei Rückfragen und formuliere sie einzeln, nicht als Liste.
        Wenn eine Antwort ausbleibt, hake genau einmal nach.
        Triff keine Absage-Entscheidung allein aufgrund einer Lücke im Lebenslauf.

  - name: "KI-Interview"
    category: AIVoiceInterview
    color: "#8ECAE6"
    agent:
      name: "Interview-Agent"
      type: proactive
      description: "Führt das strukturierte Erstinterview und protokolliert die Antworten."
      human_in_loop: always_off
      active: true
      # AIVoiceInterview agents require these two fields; the API answers 422
      # without them. InterviewLanguage "auto" avoids having to pin a voice id,
      # which would otherwise be required and must match the language.
      additional_fields:
        InterviewLanguage: "auto"
        GreetingInstructions: |
          Begrüße die Person mit Namen, nenne die Position und sag, dass das
          Gespräch etwa 15 Minuten dauert und aufgezeichnet wird.
          Frage, ob es gerade passt, und biete sonst einen anderen Termin an.
        EndOfCallProcedure: |
          Fasse in zwei Sätzen zusammen, was besprochen wurde.
          Nenne als nächsten Schritt die Rückmeldung innerhalb von fünf Werktagen.
          Bedanke dich und beende das Gespräch, ohne eine Einschätzung abzugeben.
      instructions: |
        Du führst ein strukturiertes Erstinterview von etwa 15 Minuten.

        Decke diese Themen ab:
        - konkrete Projekterfahrung mit den in der Ausschreibung genannten Technologien
        - Arbeitsweise im Team, Umgang mit Code Reviews
        - Motivation für einen Wechsel

        Frage nach Beispielen statt nach Selbsteinschätzungen.
        Bewerte nicht im Gespräch, sondern protokolliere die Antworten sachlich.

  - name: "Persönliches Interview"
    category: HumanInterview
    color: "#FFB703"

  - name: "Teamentscheidung"
    category: TeamDiscussion
    color: "#FFD59E"

  - name: "Vertragsangebot"
    category: ContractOffer
    color: "#B7E4C7"

  # 'Rejected' is the fixed rejection step and likewise cannot be removed.
  - name: "Abgelehnt"
    category: Rejected
    color: "#E5989B"
