# The list a customer hands over at kickoff, usually exported from their own ATS.
#
# `external_id` is the customer's own job id. It is what makes this file safe to
# re-run: the tool looks the job up by external id before creating anything, so
# running twice does not create twice.
#
# category / career_level / employment_type / working_hours accept the words a
# customer actually writes. They are resolved against the live reference lists,
# and an unknown value fails with the list of valid options instead of a 422.

customer: "Beispiel GmbH"

jobs:
