    internal_name: "BE01 - Senior Backend"
    location: "Berlin"
    region: "EMEA"
    # Mixed on purpose: a localised name here, an ID below - both resolve.
    category: "IT"
    career_level: "Oberstufe"
    working_hours: "FullTime"
    # Test data stays unpublished: this account feeds public job XML endpoints
    # (/job/xml-feed/stepstone), and demo jobs have no business showing up there.
    published: false
    description: |
      Wir suchen eine erfahrene Backend-Entwicklerin oder einen erfahrenen
      Backend-Entwickler für unsere Plattform.

      Aufgaben:
      - Entwurf und Betrieb von Services in Go und Python
      - Ausbau unserer REST-Schnittstellen
      - Code Reviews und technische Abstimmung im Team

      Anforderungen:
      - mindestens fünf Jahre Erfahrung in der Backend-Entwicklung
